    email: sales@schedmd.com
    name: SchedMD LLC
    url: https://www.schedmd.com/
  description: API to access and control Slurm
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://github.com/SchedMD/slurm/blob/master/DISCLAIMER
  title: Slurm REST API
  version: Slurm-25.11.3
  x-slurm:
    data_parsers:
    - plugin: v0.0.44
      flags:
      - NONE
    openapi:
    - openapi/slurmdbd
    - openapi/slurmctld
    version:
      major: "25"
      micro: "3"
      minor: "11"
    release: 25.11.3
servers:
- url: /
security:
- user: []
  token: []
- token: []
- bearerAuth: []
- {}
tags:
- description: methods that query slurmctld
  name: slurm
- description: methods that query slurmdbd
  name: slurmdb
- description: utilities available directly through slurmrestd
  name: util
- description: methods that query for generated OpenAPI specifications
  name: openapi
paths:
  /slurmdb/v0.0.44/job/{job_id}:
    get:
      description: "This endpoint may return multiple job entries since job_id is\
        \ not a unique key - only the tuple (cluster, job_id, start_time) is unique.\
        \ If the requested job_id is a component of a heterogeneous job all components\
        \ are returned."
      operationId: slurmdb_v0044_get_job
      parameters:
      - allowReserved: false
        description: Job ID
        explode: false
        in: path
        name: job_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v0.0.44_openapi_slurmdbd_jobs_resp'
          description: Job description
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v0.0.44_openapi_slurmdbd_jobs_resp'
          description: Job description
      summary: Get job info
      tags:
      - slurmdb
    post:
      operationId: slurmdb_v0044_post_job
      parameters:
      - allowReserved: false
        description: Job ID
        explode: false
        in: path
        name: job_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v0.0.44_job_modify'
        description: Job update description
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v0.0.44_openapi_job_modify_resp'
          description: Job update results
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v0.0.44_openapi_job_modify_resp'
          description: Job update results
      summary: Update job
      tags:
      - slurmdb
